<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#050505">
  <title>Home Weather</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://api.openweathermap.org">
  <link rel="preconnect" href="https://openweathermap.org">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/@phosphor-icons/web" defer></script>
  <style>
    :root {
      color-scheme: light;
      --ink: #050505;
      --muted: rgba(5, 5, 5, 0.62);
      --line: rgba(5, 5, 5, 0.18);
      --weather: #ffe84a;
      --weather-2: #fff4a8;
      --accent: #42c6ff;
      --black: #050505;
      --white: #fffdf8;
      --shadow: 0 32px 90px rgba(0, 0, 0, 0.24);
      --max: 1240px;
      --radius-xl: 44px;
      --radius-lg: 30px;
      --radius-md: 22px;
    }

    * { box-sizing: border-box; }
    html { background: var(--black); }

    body {
      min-height: 100svh;
      margin: 0;
      color: var(--ink);
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 10% 8%, color-mix(in srgb, var(--weather) 72%, white 10%), transparent 30rem),
        radial-gradient(circle at 92% 4%, color-mix(in srgb, var(--accent) 42%, transparent), transparent 28rem),
        linear-gradient(135deg, var(--weather) 0%, var(--weather-2) 100%);
      overflow-x: hidden;
      transition: background 600ms ease, color 600ms ease;
    }

    body.night {
      color: var(--white);
      --muted: rgba(255, 255, 255, 0.66);
      --line: rgba(255, 255, 255, 0.18);
      background:
        radial-gradient(circle at 10% 8%, rgba(108, 96, 255, 0.32), transparent 30rem),
        radial-gradient(circle at 90% 6%, rgba(255, 100, 212, 0.18), transparent 28rem),
        linear-gradient(135deg, #090918 0%, #171039 58%, #050505 100%);
    }

    button { font: inherit; border: 0; cursor: pointer; }

    .shell {
      width: min(var(--max), calc(100% - clamp(24px, 5vw, 72px)));
      margin: 0 auto;
      padding: clamp(20px, 4vw, 48px) 0 54px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: clamp(26px, 5vw, 64px);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
      min-width: 0;
    }

    .brand-mark {
      width: 48px;
      height: 48px;
      border: 3px solid currentColor;
      border-radius: 17px;
      display: grid;
      place-items: center;
      background: var(--black);
      color: var(--weather);
      box-shadow: 7px 7px 0 currentColor;
    }

    body.night .brand-mark {
      background: var(--white);
      color: var(--black);
      box-shadow: 7px 7px 0 rgba(255, 255, 255, 0.16);
    }

    .brand-mark i { font-size: 25px; }

    .brand-title {
      margin: 0;
      font-family: Sora, Inter, sans-serif;
      font-size: clamp(1.1rem, 2vw, 1.42rem);
      letter-spacing: -0.05em;
      line-height: 1;
    }

    .brand-subtitle {
      margin: 5px 0 0;
      color: var(--muted);
      font-size: 0.92rem;
      font-weight: 750;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .btn {
      min-height: 46px;
      border: 2px solid currentColor;
      border-radius: 999px;
      color: currentColor;
      background: transparent;
      padding: 0 18px;
      font-weight: 850;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: transform 180ms ease, background 180ms ease, color 180ms ease;
    }

    .btn:hover, .btn:focus-visible { transform: translateY(-2px); outline: none; }

    .btn.primary {
      background: var(--black);
      color: var(--white);
      border-color: var(--black);
    }

    body.night .btn.primary {
      background: var(--white);
      color: var(--black);
      border-color: var(--white);
    }

    .hero {
      display: grid;
      grid-template-columns: minmax(0, 1.15fr) minmax(320px, 0.85fr);
      gap: clamp(18px, 3vw, 34px);
      align-items: stretch;
    }

    .main-card {
      min-height: min(760px, calc(100svh - 150px));
      border: 4px solid currentColor;
      border-radius: var(--radius-xl);
      padding: clamp(24px, 5vw, 54px);
      background:
        radial-gradient(circle at 88% 8%, color-mix(in srgb, var(--accent) 26%, transparent), transparent 16rem),
        linear-gradient(155deg, var(--weather) 0%, var(--weather-2) 100%);
      color: var(--black);
      box-shadow: var(--shadow), 12px 12px 0 var(--black);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
      position: relative;
    }

    body.night .main-card {
      color: var(--white);
      box-shadow: var(--shadow), 12px 12px 0 rgba(255, 255, 255, 0.12);
    }

    .main-card::before {
      content: "Weather Forecast Weather Forecast";
      position: absolute;
      inset: auto -3rem 2rem -3rem;
      font-family: Sora, Inter, sans-serif;
      font-size: clamp(2.2rem, 6vw, 5.2rem);
      line-height: 1;
      font-weight: 800;
      letter-spacing: -0.08em;
      opacity: 0.075;
      white-space: nowrap;
      pointer-events: none;
    }

    .hero-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 22px;
      position: relative;
      z-index: 1;
    }

    .pill {
      width: fit-content;
      border: 2px solid currentColor;
      border-radius: 999px;
      background: var(--black);
      color: var(--white);
      padding: 9px 14px;
      font-size: 0.78rem;
      font-weight: 850;
    }

    body.night .pill {
      background: var(--white);
      color: var(--black);
    }

    .weather-icon {
      width: clamp(58px, 8vw, 94px);
      height: clamp(58px, 8vw, 94px);
      border-radius: 26px;
      display: grid;
      place-items: center;
      background: var(--black);
      color: var(--accent);
      transform: rotate(4deg);
    }

    body.night .weather-icon {
      background: var(--white);
      color: var(--black);
    }

    .weather-icon i { font-size: clamp(32px, 5vw, 56px); }

    .hero-main {
      position: relative;
      z-index: 1;
      margin-top: clamp(30px, 6vw, 70px);
    }

    .eyebrow {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 12px;
      margin: 0 0 20px;
      color: color-mix(in srgb, currentColor 72%, transparent);
      font-family: Sora, Inter, sans-serif;
      font-size: clamp(0.9rem, 2vw, 1.1rem);
      font-weight: 750;
    }

    .spark {
      width: 28px;
      height: 28px;
      position: relative;
      opacity: 0.55;
      flex: 0 0 auto;
    }

    .spark::before, .spark::after {
      content: "";
      position: absolute;
      inset: 50% auto auto 50%;
      width: 100%;
      height: 2px;
      background: currentColor;
      transform: translate(-50%, -50%);
    }

    .spark::after { transform: translate(-50%, -50%) rotate(90deg); }

    .city {
      margin: 0;
      font-family: Sora, Inter, sans-serif;
      font-size: clamp(4.4rem, 15vw, 12rem);
      line-height: 0.84;
      letter-spacing: -0.11em;
      font-weight: 800;
    }

    .temperature {
      margin: clamp(16px, 3vw, 28px) 0 0;
      font-family: Sora, Inter, sans-serif;
      font-size: clamp(7rem, 20vw, 16rem);
      line-height: 0.75;
      letter-spacing: -0.14em;
      font-weight: 800;
    }

    .summary-card {
      position: relative;
      z-index: 1;
      margin-top: clamp(30px, 5vw, 56px);
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 20px;
      align-items: end;
    }

    .summary-card h2 {
      margin: 0 0 8px;
      font-family: Sora, Inter, sans-serif;
      font-size: clamp(1rem, 2vw, 1.35rem);
      letter-spacing: -0.04em;
    }

    .summary-card p {
      margin: 0;
      max-width: 560px;
      line-height: 1.48;
      font-weight: 750;
      color: color-mix(in srgb, currentColor 78%, transparent);
    }

    .updated {
      white-space: nowrap;
      font-weight: 850;
      color: color-mix(in srgb, currentColor 70%, transparent);
    }

    .side-stack {
      display: grid;
      gap: clamp(18px, 3vw, 28px);
      min-width: 0;
    }

    .black-panel {
      border-radius: var(--radius-xl);
      background: var(--black);
      color: var(--white);
      padding: clamp(22px, 3vw, 32px);
      box-shadow: var(--shadow);
      min-width: 0;
    }

    .panel-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 18px;
    }

    .panel-title h2 {
      margin: 0;
      font-family: Sora, Inter, sans-serif;
      font-size: clamp(1.35rem, 3vw, 2.2rem);
      line-height: 1;
      letter-spacing: -0.06em;
    }

    .panel-title i { font-size: 28px; color: var(--accent); }

    .metric-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .metric-card {
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: var(--radius-md);
      background: rgba(255, 255, 255, 0.07);
      padding: 17px;
      min-width: 0;
    }

    .metric-card i {
      display: block;
      color: var(--accent);
      font-size: 28px;
      margin-bottom: 16px;
    }

    .metric-card span {
      display: block;
      color: rgba(255, 255, 255, 0.62);
      font-size: 0.76rem;
      font-weight: 800;
    }

    .metric-card strong {
      display: block;
      margin-top: 7px;
      font-family: Sora, Inter, sans-serif;
      font-size: clamp(1.25rem, 3vw, 1.9rem);
      letter-spacing: -0.06em;
      overflow-wrap: anywhere;
    }

    .forecast-panel {
      border-radius: var(--radius-xl);
      background: color-mix(in srgb, var(--white) 64%, var(--weather) 28%);
      color: var(--black);
      border: 3px solid var(--black);
      padding: clamp(20px, 3vw, 28px);
      box-shadow: var(--shadow);
    }

    body.night .forecast-panel {
      background: rgba(255, 255, 255, 0.1);
      color: var(--white);
      border-color: rgba(255, 255, 255, 0.24);
    }

    .forecast-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 18px;
    }

    .forecast-head h2 {
      margin: 0;
      font-family: Sora, Inter, sans-serif;
      font-size: clamp(1.2rem, 3vw, 1.8rem);
      letter-spacing: -0.05em;
    }

    .forecast-head i { font-size: 26px; }

    .forecast-row, .hour-row {
      display: grid;
      grid-auto-flow: column;
      gap: 10px;
      overflow-x: auto;
      padding-bottom: 2px;
      scrollbar-width: none;
      scroll-snap-type: x mandatory;
    }

    .forecast-row::-webkit-scrollbar, .hour-row::-webkit-scrollbar { display: none; }
    .forecast-row { grid-auto-columns: minmax(92px, 1fr); }
    .hour-row { grid-auto-columns: minmax(116px, 1fr); margin-top: 14px; }

    .day-card, .hour-card {
      scroll-snap-align: start;
      border: 2px solid currentColor;
      border-radius: 20px;
      padding: 14px 12px;
      min-height: 128px;
      display: grid;
      place-items: center;
      text-align: center;
      gap: 7px;
      font-weight: 850;
      background: rgba(255, 255, 255, 0.1);
    }

    .day-card strong, .hour-card strong {
      font-family: Sora, Inter, sans-serif;
      font-size: 1.3rem;
      letter-spacing: -0.06em;
    }

    .day-card i, .hour-card i {
      font-size: 26px;
      color: var(--accent);
    }

    .day-card span, .hour-card span {
      font-size: 0.74rem;
      color: color-mix(in srgb, currentColor 68%, transparent);
    }

    .chart-panel {
      margin-top: 18px;
      border-radius: var(--radius-lg);
      background: var(--weather);
      color: var(--black);
      padding: 16px;
      border: 2px solid var(--black);
    }

    .chart-panel h3 {
      margin: 0 0 12px;
      font-family: Sora, Inter, sans-serif;
      letter-spacing: -0.04em;
    }

    canvas {
      display: block;
      width: 100%;
      height: 190px;
    }

    .status {
      margin: 20px 0 0;
      color: var(--muted);
      font-size: 0.92rem;
      font-weight: 750;
      min-height: 22px;
    }

    @media (max-width: 1040px) {
      .hero { grid-template-columns: 1fr; }
      .main-card { min-height: auto; }
      .city { font-size: clamp(4.2rem, 18vw, 9rem); }
      .temperature { font-size: clamp(7rem, 28vw, 13rem); }
    }

    @media (max-width: 660px) {
      .shell { width: min(100% - 24px, var(--max)); padding-top: 16px; }
      .topbar { align-items: stretch; flex-direction: column; }
      .actions { justify-content: stretch; }
      .btn { flex: 1 1 auto; justify-content: center; padding: 0 12px; }
      .main-card { border-width: 3px; border-radius: 32px; box-shadow: var(--shadow), 8px 8px 0 var(--black); }
      .summary-card { grid-template-columns: 1fr; }
      .metric-grid { grid-template-columns: 1fr; }
      .city { font-size: clamp(3.7rem, 20vw, 6.4rem); }
      .temperature { font-size: clamp(6.2rem, 34vw, 9rem); }
      .forecast-row { grid-auto-columns: minmax(82px, 1fr); }
    }
  </style>
</head>
<body>
  <main class="shell" aria-live="polite">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true"><i id="brandIcon" class="ph-fill ph-sun"></i></div>
        <div>
          <p class="brand-title">Home Weather</p>
          <p class="brand-subtitle" id="place">London, Ontario</p>
        </div>
      </div>
      <div class="actions">
        <button class="btn" id="saveKey"><i class="ph ph-key"></i>Key</button>
        <button class="btn" id="clearCache"><i class="ph ph-trash"></i>Cache</button>
        <button class="btn primary" id="refresh"><i class="ph ph-arrows-clockwise"></i>Refresh</button>
      </div>
    </header>

    <section class="hero">
      <article class="main-card" aria-label="Current weather">
        <div class="hero-top">
          <div class="pill" id="datePill">Loading</div>
          <div class="weather-icon" aria-hidden="true"><i id="heroIcon" class="ph-fill ph-sun"></i></div>
        </div>
        <div class="hero-main">
          <p class="eyebrow"><span>Weather</span><span class="spark"></span><span id="conditionWord">Forecast</span><span class="spark"></span></p>
          <h1 class="city" id="cityBig">London</h1>
          <div class="temperature" id="tempMain">--°</div>
        </div>
        <div class="summary-card">
          <div><h2>Daily Summary</h2><p id="summaryText">Loading your local weather.</p></div>
          <div class="updated" id="updated">Starting</div>
        </div>
      </article>

      <div class="side-stack">
        <section class="black-panel" aria-label="Current weather details">
          <div class="panel-title"><h2>Right now</h2><i id="panelIcon" class="ph-fill ph-sun"></i></div>
          <div class="metric-grid">
            <div class="metric-card"><i class="ph ph-wind"></i><span>Wind</span><strong id="wind">--</strong></div>
            <div class="metric-card"><i class="ph ph-drop"></i><span>Humidity</span><strong id="humidity">--</strong></div>
            <div class="metric-card"><i class="ph ph-eye"></i><span>Visibility</span><strong id="visibility">--</strong></div>
            <div class="metric-card"><i class="ph ph-thermometer-simple"></i><span>Feels like</span><strong id="feels">--°</strong></div>
            <div class="metric-card"><i class="ph ph-cloud-rain"></i><span>Rain chance</span><strong id="rainChance">--</strong></div>
            <div class="metric-card"><i class="ph ph-gauge"></i><span>Pressure</span><strong id="pressure">--</strong></div>
          </div>
        </section>

        <section class="forecast-panel" aria-label="Forecast">
          <div class="forecast-head"><h2>Weekly forecast</h2><i class="ph ph-arrow-right"></i></div>
          <div class="forecast-row" id="dailyRow"></div>
          <div class="chart-panel"><h3>Next 36 hours</h3><canvas id="chart" role="img" aria-label="Temperature trend for the next 36 hours"></canvas></div>
          <div class="hour-row" id="hourRow"></div>
        </section>
      </div>
    </section>

    <p class="status" id="status">Starting dashboard...</p>
  </main>

  <script>
    const HOME = { lat: 42.9849, lon: -81.2453 };
    const API = "https://api.openweathermap.org/data/2.5";
    const KEY_STORE = "home_weather_key";
    const CACHE_STORE = "home_weather_cache_v5";
    const $ = (id) => document.getElementById(id);
    const el = {
      brandIcon: $("brandIcon"), heroIcon: $("heroIcon"), panelIcon: $("panelIcon"), place: $("place"), cityBig: $("cityBig"), datePill: $("datePill"), conditionWord: $("conditionWord"), tempMain: $("tempMain"), summaryText: $("summaryText"), updated: $("updated"), wind: $("wind"), humidity: $("humidity"), visibility: $("visibility"), feels: $("feels"), rainChance: $("rainChance"), pressure: $("pressure"), dailyRow: $("dailyRow"), hourRow: $("hourRow"), chart: $("chart"), status: $("status"), saveKey: $("saveKey"), clearCache: $("clearCache"), refresh: $("refresh")
    };
    let lastForecast = [];
    let lastZone = 0;

    start();

    function start() {
      el.saveKey.onclick = saveKey;
      el.clearCache.onclick = () => { localStorage.removeItem(CACHE_STORE); status("Cache cleared. Refreshing..."); load(true); };
      el.refresh.onclick = () => load(true);
      window.addEventListener("resize", debounce(() => draw(lastForecast, lastZone), 160));
      const cached = readCache();
      if (cached) {
        render(cached.current, cached.forecast, cached.savedAt, true);
        status("Showing cached weather while checking for fresh data.");
      }
      if (!key()) {
        saveKey();
        if (!cached) status("Save your OpenWeather key once to start.");
        return;
      }
      load(false);
    }

    function key() { return localStorage.getItem(KEY_STORE) || ""; }

    function saveKey() {
      const value = prompt("Paste your OpenWeather API key", key());
      if (value) {
        localStorage.setItem(KEY_STORE, value.trim());
        load(true);
      }
    }

    async function load(force) {
      const appid = key();
      if (!appid) { saveKey(); return; }
      busy(true);
      if (force) status("Refreshing live weather...");
      try {
        const q = new URLSearchParams({ lat: HOME.lat, lon: HOME.lon, appid, units: "metric" });
        const [current, forecast] = await Promise.all([
          getJSON(`${API}/weather?${q}`),
          getJSON(`${API}/forecast?${q}`)
        ]);
        const savedAt = Date.now();
        localStorage.setItem(CACHE_STORE, JSON.stringify({ current, forecast, savedAt }));
        render(current, forecast, savedAt, false);
        status("Fresh weather loaded just now.");
      } catch (err) {
        const cached = readCache();
        if (cached) {
          render(cached.current, cached.forecast, cached.savedAt, true);
          status(`Live refresh failed. Cached weather is showing. ${err.message}`);
        } else {
          status(`Could not load weather. ${err.message}`);
        }
      } finally {
        busy(false);
      }
    }

    async function getJSON(url) {
      const response = await fetch(url, { cache: "no-store" });
      const text = await response.text();
      let data;
      try { data = JSON.parse(text); } catch { data = { message: text || response.statusText }; }
      if (!response.ok) throw new Error(data.message || response.statusText || "Request failed");
      return data;
    }

    function render(current, forecast, savedAt, cached) {
      lastForecast = forecast.list || [];
      lastZone = current.timezone || forecast.city?.timezone || 0;
      const weather = current.weather?.[0] || {};
      const main = current.main || {};
      const city = current.name || forecast.city?.name || "London";
      const country = current.sys?.country || forecast.city?.country || "CA";
      const temp = Math.round(main.temp ?? 0);
      const feels = Math.round(main.feels_like ?? temp);
      const wind = Math.round((current.wind?.speed || 0) * 3.6);
      const pop = todayPop(forecast.list || [], lastZone);
      const desc = weather.description || weather.main || "current conditions";
      const visibility = current.visibility ? `${Math.min(10, current.visibility / 1000).toFixed(current.visibility >= 10000 ? 0 : 1)} km` : "--";
      const icon = iconFor(weather.main, localHour(lastZone), true);

      applyPalette(weather.main, lastZone);
      el.brandIcon.className = icon;
      el.heroIcon.className = icon;
      el.panelIcon.className = icon;
      el.place.textContent = `${city}, ${country}`;
      el.cityBig.textContent = city;
      el.datePill.textContent = dateLabel(lastZone);
      el.conditionWord.textContent = desc;
      el.tempMain.textContent = `${temp}°`;
      el.summaryText.textContent = `Now it feels like ${feels}°. Wind is ${wind} km/h, humidity is ${main.humidity ?? "--"}%, and today's rain chance is ${Math.round(pop * 100)}%.`;
      el.updated.textContent = cached ? `Cached ${age(savedAt)}` : `Updated ${time(current.dt, lastZone)}`;
      el.wind.textContent = `${wind} km/h`;
      el.humidity.textContent = `${main.humidity ?? "--"}%`;
      el.visibility.textContent = visibility;
      el.feels.textContent = `${feels}°`;
      el.rainChance.textContent = `${Math.round(pop * 100)}%`;
      el.pressure.textContent = `${main.pressure ?? "--"} hPa`;
      renderDays(forecast, lastZone);
      renderHours(forecast, lastZone);
      draw(lastForecast, lastZone);
    }

    function applyPalette(main = "", zone = 0) {
      const hour = localHour(zone);
      const condition = String(main).toLowerCase();
      const night = hour < 6 || hour >= 20;
      document.body.classList.toggle("night", night);
      document.body.dataset.weather = condition;
      let palette = { weather: "#FFE84A", weather2: "#FFF4A8", accent: "#42C6FF" };
      if (night) palette = { weather: "#171039", weather2: "#050505", accent: "#FF64D4" };
      if (condition.includes("rain") || condition.includes("drizzle")) palette = night ? { weather: "#0B1535", weather2: "#050505", accent: "#42C6FF" } : { weather: "#42C6FF", weather2: "#BFEFFF", accent: "#FFE84A" };
      if (condition.includes("cloud")) palette = night ? { weather: "#171039", weather2: "#2E2A4F", accent: "#C6FF8B" } : { weather: "#E7E2D4", weather2: "#FFFDF8", accent: "#42C6FF" };
      if (condition.includes("snow")) palette = { weather: "#F4FBFF", weather2: "#DDEEFF", accent: "#42C6FF" };
      if (condition.includes("thunder")) palette = { weather: "#050505", weather2: "#241C4D", accent: "#FFE84A" };
      document.documentElement.style.setProperty("--weather", palette.weather);
      document.documentElement.style.setProperty("--weather-2", palette.weather2);
      document.documentElement.style.setProperty("--accent", palette.accent);
    }

    function renderDays(forecast, zone) {
      el.dailyRow.innerHTML = byDay(forecast.list || [], zone).slice(0, 5).map(day => `
        <div class="day-card">
          <strong>${Math.round(day.max)}°</strong>
          <i class="${iconFor(day.main, 12)}"></i>
          <span>${day.label}</span>
        </div>
      `).join("");
    }

    function renderHours(forecast, zone) {
      el.hourRow.innerHTML = (forecast.list || []).slice(0, 8).map(item => {
        const weather = item.weather?.[0] || {};
        return `<div class="hour-card"><span>${hour(item.dt, zone)}</span><i class="${iconFor(weather.main, localHour(zone))}"></i><strong>${Math.round(item.main.temp)}°</strong></div>`;
      }).join("");
    }

    function draw(items, zone) {
      const canvas = el.chart;
      const ctx = canvas.getContext("2d");
      const points = (items || []).slice(0, 12);
      const rect = canvas.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;
      canvas.width = Math.max(1, Math.floor(rect.width * dpr));
      canvas.height = Math.max(1, Math.floor(rect.height * dpr));
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.clearRect(0, 0, rect.width, rect.height);
      if (!points.length) return;
      const temps = points.map(x => x.main.temp);
      const min = Math.floor(Math.min(...temps)) - 1;
      const max = Math.ceil(Math.max(...temps)) + 1;
      const pad = 24;
      const w = rect.width - pad * 2;
      const h = rect.height - pad * 2;
      const xy = points.map((item, i) => ({ x: pad + w / Math.max(1, points.length - 1) * i, y: pad + h - ((item.main.temp - min) / Math.max(1, max - min)) * h, temp: item.main.temp }));
      ctx.strokeStyle = "rgba(5,5,5,.18)";
      ctx.lineWidth = 1;
      for (let i = 0; i < 4; i++) { const y = pad + h / 3 * i; ctx.beginPath(); ctx.moveTo(pad, y); ctx.lineTo(rect.width - pad, y); ctx.stroke(); }
      ctx.beginPath();
      xy.forEach((pt, i) => { if (i === 0) ctx.moveTo(pt.x, pt.y); else { const prev = xy[i - 1]; const cx = (prev.x + pt.x) / 2; ctx.bezierCurveTo(cx, prev.y, cx, pt.y, pt.x, pt.y); } });
      ctx.strokeStyle = "#050505";
      ctx.lineWidth = 4;
      ctx.stroke();
      ctx.font = "700 12px Inter, system-ui";
      ctx.fillStyle = "#050505";
      ctx.textAlign = "center";
      xy.forEach((pt, i) => { ctx.beginPath(); ctx.arc(pt.x, pt.y, 5, 0, Math.PI * 2); ctx.fill(); if (i % 2 === 0) ctx.fillText(`${Math.round(pt.temp)}°`, pt.x, pt.y - 13); });
    }

    function byDay(list, zone) {
      const groups = new Map();
      list.forEach(item => { const key = new Date((item.dt + zone) * 1000).toISOString().slice(0, 10); if (!groups.has(key)) groups.set(key, []); groups.get(key).push(item); });
      return [...groups.values()].map(values => {
        const temps = values.map(x => x.main.temp);
        const common = commonWeather(values);
        return { label: dayLabel(values[0].dt, zone), min: Math.min(...temps), max: Math.max(...temps), pop: Math.max(...values.map(x => x.pop || 0)), main: common.main, condition: common.description || common.main || "forecast" };
      });
    }

    function commonWeather(values) {
      const map = new Map();
      values.forEach(item => { const weather = item.weather?.[0] || {}; const key = weather.description || weather.main || "forecast"; map.set(key, { count: (map.get(key)?.count || 0) + 1, weather }); });
      return [...map.values()].sort((a, b) => b.count - a.count)[0]?.weather || {};
    }

    function iconFor(main = "", hour = 12, fill = false) {
      const prefix = fill ? "ph-fill" : "ph";
      const condition = String(main).toLowerCase();
      if (condition.includes("thunder")) return `${prefix} ph-cloud-lightning`;
      if (condition.includes("rain") || condition.includes("drizzle")) return `${prefix} ph-cloud-rain`;
      if (condition.includes("snow")) return `${prefix} ph-cloud-snow`;
      if (condition.includes("cloud")) return `${prefix} ph-cloud`;
      if (hour < 6 || hour >= 20) return `${prefix} ph-moon-stars`;
      return `${prefix} ph-sun`;
    }

    function todayPop(list, zone) {
      const today = new Date((Date.now() / 1000 + zone) * 1000).toISOString().slice(0, 10);
      return Math.max(0, ...list.filter(x => new Date((x.dt + zone) * 1000).toISOString().slice(0, 10) === today).map(x => x.pop || 0));
    }

    function readCache() { try { const x = JSON.parse(localStorage.getItem(CACHE_STORE) || "null"); if (x?.current && x?.forecast) return x; } catch {} return null; }
    function age(savedAt) { const m = Math.max(0, Math.round((Date.now() - savedAt) / 60000)); if (m < 1) return "just now"; if (m < 60) return `${m} min ago`; return `${Math.round(m / 60)} hr ago`; }
    function localHour(zone) { return new Date((Date.now() / 1000 + zone) * 1000).getUTCHours(); }
    function time(t, zone) { if (!t) return "--"; return new Date((t + zone) * 1000).toLocaleTimeString("en-CA", { hour: "numeric", minute: "2-digit", timeZone: "UTC" }); }
    function hour(t, zone) { return new Date((t + zone) * 1000).toLocaleTimeString("en-CA", { hour: "numeric", timeZone: "UTC" }).toLowerCase(); }
    function dateLabel(zone) { return new Date((Date.now() / 1000 + zone) * 1000).toLocaleDateString("en-CA", { weekday: "long", month: "long", day: "numeric", timeZone: "UTC" }); }
    function dayLabel(t, zone) { const d = new Date((t + zone) * 1000); const today = new Date((Date.now() / 1000 + zone) * 1000).toISOString().slice(0, 10); return d.toISOString().slice(0, 10) === today ? "Today" : d.toLocaleDateString("en-CA", { weekday: "short", timeZone: "UTC" }); }
    function status(x) { el.status.textContent = x; }
    function busy(v) { el.refresh.disabled = v; el.refresh.style.opacity = v ? ".66" : ""; }
    function debounce(fn, delay) { let t; return (...args) => { clearTimeout(t); t = setTimeout(() => fn(...args), delay); }; }
  </script>
</body>
